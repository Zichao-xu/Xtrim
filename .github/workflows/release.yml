name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0-alpha)'
        required: true

permissions:
  contents: write

jobs:
  # 本地已构建并发布（Release 里已有 DMG）时跳过云端构建，避免覆盖本地上传的安装包。
  precheck:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.check.outputs.published }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | grep -qx 'Xtrim-macOS.dmg'; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  build-macos:
    needs: precheck
    if: needs.precheck.outputs.published != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Verify Go core
        working-directory: core
        run: |
          go vet ./...
          go test -race ./...

      - name: Build macOS app
        working-directory: platforms/macos
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project WgSense.xcodeproj -scheme WgSense \
            -configuration Release build \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            -derivedDataPath build

      - name: Verify all app icon representations
        run: xcrun swift branding/GenerateAppIcon.swift --check

      - name: Verify product README
        run: |
          python3 tests/docs/check-readme.py
          python3 docs/images/check-media.py --static

      - name: Verify spacing, type and radius tokens
        run: python3 tests/tokens/tokens.py platforms/macos/WgSense --check

      - name: Verify native light and dark brand artwork
        run: zsh tests/branding/check-appearance.sh platforms/macos/build/Build/Products/Release/Xtrim.app "${{ runner.temp }}/wgsense-brand-checks"

      - name: Verify HUD model and motion
        run: |
          ./tests/appearance/check.sh "${{ runner.temp }}/wgsense-region-colors"
          ./tests/hud/check-monitor.sh
          ./tests/hud/check-motion.sh

      - name: Verify app bundle
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          app="platforms/macos/build/Build/Products/Release/Xtrim.app"
          test -x "$app/Contents/Resources/libexec/wgsense-daemon"
          test -x "$app/Contents/Resources/packaging/wgsense-install-services.sh"
          test -x "$app/Contents/Resources/packaging/wgsense-uninstall-services.sh"
          test -f "$app/Contents/Resources/AppIcon.icns"
          plutil -lint "$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = "26.0"
          tag="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          test -f "docs/releases/$tag.md"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "${tag#v}"
          widget="$app/Contents/PlugIns/WgSenseWidget.appex"
          test "$(lipo -archs "$app/Contents/MacOS/Xtrim")" = "arm64"
          test "$(lipo -archs "$widget/Contents/MacOS/WgSenseWidget")" = "arm64"
          test "$(lipo -archs "$app/Contents/Resources/libexec/wgsense-daemon")" = "arm64"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$widget/Contents/Info.plist")" = "${tag#v}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$widget/Contents/Info.plist")" = "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")"
          codesign --verify --deep --strict "$app"

      - name: Create install DMG
        run: |
          brew install create-dmg
          chmod +x packaging/create-dmg.sh
          packaging/create-dmg.sh \
            platforms/macos/build/Build/Products/Release/Xtrim.app \
            Xtrim-macOS.dmg
          shasum -a 256 Xtrim-macOS.dmg > SHA256SUMS.txt

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xtrim-macOS
          path: |
            Xtrim-macOS.dmg
            SHA256SUMS.txt

  release:
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Xtrim-macOS
          path: artifacts/

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Xtrim ${{ steps.tag.outputs.tag }}
          body_path: docs/releases/${{ steps.tag.outputs.tag }}.md
          files: |
            artifacts/Xtrim-macOS.dmg
            artifacts/SHA256SUMS.txt
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
