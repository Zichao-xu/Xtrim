name: WgSense
options:
  bundleIdPrefix: com.wgsense
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    # 二进制 plist 可内存映射，比默认 XML(UTF-16) 解析快一个量级。
    STRINGS_FILE_OUTPUT_ENCODING: binary
    DEVELOPMENT_TEAM: ""

targets:
  WgSense:
    type: application
    platform: macOS
    sources:
      - path: WgSense
        excludes:
          - SystemVPNManager.swift
          - SpeedLab/speedlab.sh
      - path: WgSense/SpeedLab/speedlab.sh
        buildPhase: resources
    preBuildScripts:
      - name: Build Bundled Daemon
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
          core_dir="$SRCROOT/../../core"
          packaging_dir="$SRCROOT/../../packaging"
          out_dir="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/libexec"
          packaging_out="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/packaging"
          mkdir -p "$out_dir" "$packaging_out"
          # 内置代理内核（自建 mihomo）：编好就以 mihomo_embed 标签嵌进 daemon，拿不到则不带
          mihomo_tags="$("$SRCROOT/vendor/build-mihomo.sh" "$core_dir" | tail -n 1)"
          (cd "$core_dir" && /usr/bin/env go build -trimpath ${mihomo_tags:+-tags "$mihomo_tags"} -o "$out_dir/wgsense-daemon" ./cmd/wgsense-daemon)
          chmod 0755 "$out_dir/wgsense-daemon"
          install -m 0755 "$packaging_dir/wgsense-install-services.sh" "$packaging_out/wgsense-install-services.sh"
          install -m 0755 "$packaging_dir/wgsense-uninstall-services.sh" "$packaging_out/wgsense-uninstall-services.sh"
          install -m 0755 "$packaging_dir/wgsense-receive-mover.sh" "$packaging_out/wgsense-receive-mover.sh"
          install -m 0644 "$packaging_dir/com.wgsense.daemon.plist.template" "$packaging_out/com.wgsense.daemon.plist.template"
          install -m 0644 "$packaging_dir/com.wgsense.receive-mover.plist.template" "$packaging_out/com.wgsense.receive-mover.plist.template"
          # 测速台：给缺 iperf3 的对端临时部署用的静态 iperf3（拉不到不影响构建）
          "$SRCROOT/vendor/fetch-iperf3.sh" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/iperf3"
    dependencies:
      - target: WgSenseWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wgsense.macos
        # 对外品牌名 Xtrim（包名、进程名、菜单名）；模块名与标识沿用 WgSense，内部代码和服务不受影响。
        PRODUCT_NAME: Xtrim
        PRODUCT_MODULE_NAME: WgSense
        MARKETING_VERSION: "41"
        CURRENT_PROJECT_VERSION: "41"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        INFOPLIST_KEY_CFBundleDisplayName: Xtrim
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSMinimumSystemVersion: "26.0"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: WgSense/WgSense.entitlements
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES

  WgSenseWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: WgSenseWidget
      - path: WgSense/Localizable.xcstrings
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wgsense.macos.widget
        PRODUCT_NAME: WgSenseWidget
        MARKETING_VERSION: "41"
        CURRENT_PROJECT_VERSION: "41"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        INFOPLIST_FILE: WgSenseWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: ""
